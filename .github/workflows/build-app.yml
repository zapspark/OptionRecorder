name: Build App

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  build-macos-app:
    name: Build macOS App
    runs-on: macos-latest
    timeout-minutes: 30

    env:
      DERIVED_DATA_PATH: .build/XcodeDerivedData
      APP_SCHEME: OptionRecoderApp
      APP_PROJECT: OptionRecorder.xcodeproj

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version

      - name: Run core tests
        run: |
          set -euo pipefail
          swift test

      - name: Build app
        run: |
          set -euo pipefail
          xcodebuild \
            -project "$APP_PROJECT" \
            -scheme "$APP_SCHEME" \
            -destination 'platform=macOS' \
            -configuration Release \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package app artifact
        run: |
          set -euo pipefail
          app_path="$DERIVED_DATA_PATH/Build/Products/Release/$APP_SCHEME.app"
          test -d "$app_path"
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "artifacts/$APP_SCHEME-macOS.zip"

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: OptionRecoderApp-macOS
          path: artifacts/OptionRecoderApp-macOS.zip
          if-no-files-found: error
          retention-days: 14
